name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.6.0)"
        required: true
        type: string
      draft:
        description: "Keep the GitHub Release as draft after asset upload"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as prerelease"
        required: true
        default: false
        type: boolean
      platforms:
        description: "Which installers to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

concurrency:
  group: release-desktop-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  verify:
    name: Verify Release Candidate
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        shell: pwsh
        run: dotnet restore .\MarkMello.sln -m:1

      - name: Test domain layer
        shell: pwsh
        run: dotnet test .\tests\MarkMello.Domain.Tests\MarkMello.Domain.Tests.csproj --no-restore -m:1 -nologo

      - name: Test presentation layer
        shell: pwsh
        run: dotnet test .\tests\MarkMello.Presentation.Tests\MarkMello.Presentation.Tests.csproj --no-restore -m:1 -nologo

      - name: Build desktop app in Release
        shell: pwsh
        run: dotnet build .\src\MarkMello.Desktop\MarkMello.Desktop.csproj -c Release --no-restore -m:1 -nologo

  prepare_release:
    name: Ensure GitHub Release
    runs-on: ubuntu-latest
    needs: verify

    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      version_core: ${{ steps.vars.outputs.version_core }}
      version_windows: ${{ steps.vars.outputs.version_windows }}
      publish_after_upload: ${{ steps.vars.outputs.publish_after_upload }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
      repo_name: ${{ steps.vars.outputs.repo_name }}

    steps:
      - name: Resolve release parameters
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            publish_after_upload="true"
          else
            tag="${{ inputs.tag }}"
            prerelease="${{ inputs.prerelease }}"
            if [[ "${{ inputs.draft }}" == "true" ]]; then
              publish_after_upload="false"
            else
              publish_after_upload="true"
            fi
          fi

          if [[ ! "$tag" =~ ^v[0-9] ]]; then
            echo "Release tag must start with v followed by a version number." >&2
            exit 1
          fi

          version="${tag#v}"
          version_core="${version%%[-+]*}"
          repo_name="${GITHUB_REPOSITORY#*/}"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "$version" == *-* ]]; then
              prerelease="true"
            else
              prerelease="false"
            fi
          fi

          IFS='.' read -r -a version_parts <<< "$version_core"
          if (( ${#version_parts[@]} < 2 || ${#version_parts[@]} > 4 )); then
            echo "Release version must contain between 2 and 4 numeric parts." >&2
            exit 1
          fi

          for part in "${version_parts[@]}"; do
            if [[ ! "$part" =~ ^[0-9]+$ ]]; then
              echo "Release version core must be numeric: $version_core" >&2
              exit 1
            fi
          done

          while (( ${#version_parts[@]} < 4 )); do
            version_parts+=(0)
          done

          version_windows="$(IFS=.; echo "${version_parts[*]}")"

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "version_core=$version_core"
            echo "version_windows=$version_windows"
            echo "publish_after_upload=$publish_after_upload"
            echo "prerelease=$prerelease"
            echo "repo_name=$repo_name"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure draft release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ steps.vars.outputs.tag }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi

          args=(
            release create "$tag"
            --draft
            --generate-notes
            --target "$GITHUB_SHA"
            --title "$tag"
          )

          if [[ "${{ steps.vars.outputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"

  build_windows:
    needs: prepare_release
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    uses: ./.github/workflows/build-windows.yml
    with:
      tag: ${{ needs.prepare_release.outputs.tag }}
      version: ${{ needs.prepare_release.outputs.version }}
      version_core: ${{ needs.prepare_release.outputs.version_core }}
      version_windows: ${{ needs.prepare_release.outputs.version_windows }}
      repo_name: ${{ needs.prepare_release.outputs.repo_name }}
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  build_macos:
    needs: prepare_release
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    uses: ./.github/workflows/build-macos.yml
    with:
      tag: ${{ needs.prepare_release.outputs.tag }}
      version: ${{ needs.prepare_release.outputs.version }}
      version_core: ${{ needs.prepare_release.outputs.version_core }}
      version_windows: ${{ needs.prepare_release.outputs.version_windows }}
      repo_name: ${{ needs.prepare_release.outputs.repo_name }}

  build_linux:
    needs: prepare_release
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    uses: ./.github/workflows/build-linux.yml
    with:
      tag: ${{ needs.prepare_release.outputs.tag }}
      version: ${{ needs.prepare_release.outputs.version }}
      version_core: ${{ needs.prepare_release.outputs.version_core }}
      version_windows: ${{ needs.prepare_release.outputs.version_windows }}
      repo_name: ${{ needs.prepare_release.outputs.repo_name }}

  finalize_release:
    name: Finalize GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare_release
      - build_windows
      - build_macos
      - build_linux
    # Пропущенная платформа не должна отменять публикацию, а упавшая — должна.
    if: ${{ !cancelled()
      && needs.prepare_release.result == 'success'
      && needs.prepare_release.outputs.publish_after_upload == 'true'
      && !contains(needs.*.result, 'failure') }}

    steps:
      - name: Publish prepared release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ needs.prepare_release.outputs.tag }}"
          args=(release edit "$tag" --draft=false)

          if [[ "${{ needs.prepare_release.outputs.prerelease }}" != "true" ]]; then
            args+=(--latest)
          fi

          gh "${args[@]}"
